# Site metadata
author-meta: "Hussain Hadah"
lang: en

# website settings
website:
  title: "Hussain Hadah"
  description: "Labor, health, and education economist at Northwestern University's RISEI Lab. Research on discrimination, identity, immigration, mental health, education, and labor markets."
  site-url: https://hussainhadah.com
  image: /img/social-card.jpg
  image-alt: "Hussain Hadah, labor, health, and education economist"
  open-graph:
    locale: en_US
  twitter-card:
    card-style: summary_large_image
  google-analytics: "G-Y1VGD6H14M"
  favicon: img/favicon.png
  
  # start of the navigation bar at the top of the website
  navbar:
    background: light
    foreground: dark
    logo: /img/logo.png
    logo-alt: "Hussain Hadah home"
    
    # your sub-pages
    left:
      - href: index.qmd
        text: Home
      - text: "Research"
        file: research/index.qmd
      - text: "Teaching"
        file: teaching/index.qmd
      - href: cv/index.qmd
        text: CV
      - href: "personal/index.qmd"
        text: "Personal"
        
    
    # your social media handles
    right:
      - icon: envelope
        aria-label: "Email Hussain Hadah"
        href: "mailto:hussainhadah@gmail.com"
      - icon: github
        aria-label: "Hussain Hadah on GitHub"
        href: https://github.com/hhadah

  
  

# Don't touch unless you know what you are doing :) ------------
  search:
    location: navbar
    type: overlay
  page-footer:
    left: |
      <span>&copy; 2026 Hussain Hadah</span>
    center: |
      <span>[ORCID](https://orcid.org/0000-0002-8705-6386) · [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)</span>
    right: |
      <span>[Source](https://github.com/hhadah/hhadah-quarto)</span>


project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "about/*.qmd"
    - "cv/*.qmd"
    - "personal/*.qmd"
    - "research/**/*.qmd"
    - "teaching/*.qmd"
  resources:
    - "img/headshot-*.webp"

  preview:
    port: 5555
    browser: true
    watch-inputs: true
    navigate: true


format:
  html:
    theme: 
      - html/hh.scss
    toc: true
    toc-depth: 4
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true
    highlight-style: monokai
    html-math-method: plain
    canonical-url: true
    include-after-body: html/accessibility.html

    toc-title: "Contents"
